name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

  formula:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Audit the formula as committed
        run: |
          brew tap-new --no-git ci/local
          tap=$(brew --repository ci/local)
          cp Formula/xan-watch.rb "$tap/Formula/xan-watch.rb"
          brew audit --strict ci/local/xan-watch

      - name: Install and test it from this checkout
        run: |
          # actions/checkout leaves a detached HEAD
          b=ci-${GITHUB_SHA::7}
          git checkout -q -B "$b"
          tap=$(brew --repository ci/local)
          from='head "https://github.com/jonaprieto/xan-watch.git"'
          from+=', branch: "main"'
          to="head \"file://$PWD\", using: :git, branch: \"$b\""
          sed "s|$from|$to|" Formula/xan-watch.rb > "$tap/Formula/xan-watch.rb"
          # a sed that matched nothing would install from GitHub
          grep -q "file://$PWD" "$tap/Formula/xan-watch.rb"
          brew install --HEAD ci/local/xan-watch
          brew test ci/local/xan-watch
